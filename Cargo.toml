[workspace]
members = ["cli", "rust", "rust/serve"]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/pkgre/pkgre"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
