[package]
name = "pkgre-indexer"
version = "0.1.1"
description = "Deterministic renderer for curated Cargo sparse registries"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = ["pkgre"]
include = ["/src", "/Cargo.toml", "/README.md"]

[lints]
workspace = true

[dependencies]
anyhow = { version = "1.0", registry = "core" }
semver = { version = "1.0", features = ["serde"], registry = "core" }
serde = { version = "1.0", features = ["derive"], registry = "core" }
serde_json = { version = "1.0", registry = "core" }
sha2 = { version = "0.10", registry = "core" }
toml = { version = "0.9", registry = "core" }
tracing = { version = "0.1", registry = "core" }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"], registry = "core" }
