[package]
name = "pkgre-indexer"
version = "0.4.0"
description = "Declarative reconciler and renderer for curated Cargo sparse registries"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = ["pkgre"]
include = ["/src", "/Cargo.toml", "/README.md"]

[lints]
workspace = true

[dependencies]
anyhow = { version = "1.0", registry = "pkgre" }
flate2 = { version = "=1.1.9", registry = "pkgre" }
nix = { version = "0.31", default-features = false, features = ["signal"], registry = "pkgre" }
semver = { version = "1.0", features = ["serde"], registry = "pkgre" }
serde = { version = "1.0", features = ["derive"], registry = "pkgre" }
serde_json = { version = "1.0", registry = "pkgre" }
sha2 = { version = "0.10", registry = "pkgre" }
toml = { version = "0.9", registry = "pkgre" }
toml_edit = { version = "=0.25.13", registry = "pkgre" }
tracing = { version = "0.1", registry = "pkgre" }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"], registry = "pkgre" }
