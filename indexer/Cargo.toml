[package]
name = "pkgre-indexer"
version = "0.2.0"
description = "Declarative reconciler and renderer for curated Cargo sparse registries"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = ["pkgre"]
include = ["/src", "/Cargo.toml", "/README.md"]

[lints]
workspace = true

[dependencies]
anyhow = { version = "1.0", registry = "universe" }
semver = { version = "1.0", features = ["serde"], registry = "universe" }
serde = { version = "1.0", features = ["derive"], registry = "universe" }
serde_json = { version = "1.0", registry = "universe" }
sha2 = { version = "0.10", registry = "universe" }
toml = { version = "0.9", registry = "universe" }
tracing = { version = "0.1", registry = "universe" }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"], registry = "universe" }
