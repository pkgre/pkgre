proxy_http_version 1.1;
proxy_pass_request_headers off;
proxy_pass_request_body off;
proxy_set_header Host "registry.test";
proxy_set_header Connection "close";
proxy_set_header Content-Length "";
proxy_set_header Transfer-Encoding "";
proxy_set_header Trailer "";
proxy_set_header Expect "";
proxy_set_header X-Pkgre-Edge-Raw-Target $pkgre_raw_target;
proxy_set_header X-Pkgre-Diag-Request-URI $request_uri;
proxy_set_header X-Pkgre-Edge-Request-Form $pkgre_request_form;
proxy_set_header X-Pkgre-Diag-Raw-Request-Line $request;
proxy_set_header X-Pkgre-Diag-Normalized-URI $uri;
proxy_set_header X-Pkgre-Diag-Location $pkgre_location_tag;
proxy_set_header X-Pkgre-Diag-Server-Protocol $server_protocol;
proxy_set_header X-Pkgre-Diag-Transport-Scheme $scheme;
proxy_set_header X-Pkgre-Diag-SNI $ssl_server_name;
proxy_set_header X-Pkgre-Diag-Input-Authority $http_host;
proxy_set_header X-Pkgre-Diag-TLS-Protocol $ssl_protocol;
proxy_set_header X-Pkgre-Diag-ALPN $ssl_alpn_protocol;
proxy_set_header X-Pkgre-Diag-Input-X-Test $http_x_test;
proxy_set_header X-Pkgre-Diag-Proof-Case $http_x_proof_case;
proxy_connect_timeout 2s;
proxy_send_timeout 2s;
proxy_read_timeout 2s;
proxy_next_upstream off;
proxy_buffering off;
proxy_redirect off;
proxy_pass http://proof_echo;
